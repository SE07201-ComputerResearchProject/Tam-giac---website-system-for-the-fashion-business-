<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="author" content="Kamran Mubarik">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Tam Giac Admin</title>
		<link rel="stylesheet" type="text/css" href="css/style.css" />
		<link rel="stylesheet" type="text/css" href="../css/mouse-effects.css?v=20260320a" />
		<link rel="stylesheet" type="text/css" href="../css/page-loader.css?v=20260321a" />

		<!-- Disable Forced Colors -->
		<style>
			@media (forced-colors: active) {
				* {
					forced-color-adjust: none !important;
				}
			}
		</style>

		<script defer src="../js/page-loader.js?v=20260321a"></script>
		<script defer src="../js/mouse-effects.js?v=20260320a"></script>
		<script defer src="js/product-admin.js?v=20260403a"></script>
	</head>
<body>

	<header>
		<div class="container">
			<div class="brand">
				<div class="logo">
					<a href="index.html">
						<img src="../img/icons/tam-giac-logo.svg">
						<div class="logo-text">
							<p class="big-logo">Tam Giac</p>
							<p class="small-logo">admin panel</p>
						</div>
					</a>
				</div>
				<div class="shop-icon">
					<div class="dropdown">
						<img src="../img/icons/account.png">
						<div class="dropdown-menu">
							<ul>
								<li><a href="../account.html">My Account</a></li>
								<li><a href="../orders.html">My Orders</a></li>
								<li><a href="#" id="adminLogoutLink">Logout</a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>
		</div>
	</header>

	<main>
		<div class="main-content">
			<div class="sidebar">
				<h3>Menu</h3>
				<ul>
					<li><a href="index.html">Home</a></li>
					<li><a class="active" href="product.html">Product</a></li>
					<li><a href="order.html">Order</a></li>
					<li><a href="category.html">Category</a></li>
					<li><a href="stock.html">Stock</a></li>
				</ul>
			</div>
			<div class="content">
				<h3>Product Manager</h3>
				<p id="adminStatus" style="margin-bottom: 20px; color: #666;">Connecting to admin API...</p>
				<div class="content-data">
					<div class="content-form">
						<form id="productAdminForm">
							<input type="hidden" id="productId" name="productId">
							<h4 id="productFormTitle">Add Product</h4>
							<div class="form-inline">
								<div class="form-group">
									<label>Product Name</label>
									<input type="text" id="pname" name="pname" required>
								</div>
								<div class="form-group">
									<label>Price</label>
									<input type="number" id="price" name="price" min="0" step="1000" required>
								</div>
							</div>
							<div class="form-inline">
								<div class="form-group">
									<label>Stock</label>
									<input type="number" id="stock" name="stock" min="0" step="1" value="10" required>
								</div>
								<div class="form-group">
									<label>Category</label>
									<select id="categoryId" name="categoryId"></select>
								</div>
							</div>
							<div class="form-group">
								<label>New Category (Optional)</label>
								<input type="text" id="categoryName" name="categoryName" placeholder="Create a new category if needed">
							</div>
							<div class="form-group">
								<label>Short Description</label>
								<input type="text" id="sdesc" name="sdesc" required>
							</div>
							<div class="form-group">
								<label>Primary Image URL</label>
								<input type="url" id="imageUrl" name="imageUrl" placeholder="https://...">
							</div>
							<div class="form-group">
								<label></label>
								<input type="submit" id="productSubmit" value="Add Product">
								<button type="button" id="productCancel" style="margin-left: 12px;">Reset</button>
							</div>
						</form>
					</div>
					<div class="content-detail">
						<h4>All Products</h4>
						<table>
							<thead>
								<tr>
									<th>Product</th>
									<th>Price</th>
									<th>Category</th>
									<th>Status</th>
									<th>Edit</th>
									<th>Delete</th>
								</tr>
							</thead>
							<tbody id="adminProductsTable">
								<tr>
									<td colspan="6">Loading products...</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</main>

	<footer>
		<div class="container">
			<div class="footer-bar">
				<div class="copyright-text">
					<p>Copryright 2020 - All Rights Reserved</p>
				</div>
			</div>
		</div>
	</footer>

</body>

</html>
